name: Test and publish Magic Cat
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/logic.test.cjs tests/art.test.cjs tests/reading.test.cjs
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    uses: jehyunlee/apps/.github/workflows/publish-app.yml@main
    with:
      app: magicat
      revision: ${{ github.sha }}
    secrets:
      APPS_DEPLOY_KEY: ${{ secrets.APPS_DEPLOY_KEY }}
